server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = /print.html { return 301 /print$is_args$args; }
    location = /jpeg.html { return 301 /jpeg$is_args$args; }
    location = /tech.html { return 301 /tech$is_args$args; }
    location = /print/ { return 301 /print$is_args$args; }
    location = /jpeg/ { return 301 /jpeg$is_args$args; }
    location = /tech/ { return 301 /tech$is_args$args; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
